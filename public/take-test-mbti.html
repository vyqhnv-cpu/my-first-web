<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài test tính cách MBTI — The LifeSkill Hub</title>
    <link rel="icon" href="asset/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .test-container {
        max-width: 800px;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      .test-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .progress-container {
        width: 100%;
        background-color: #E5E7EB;
        border-radius: 9999px;
        height: 12px;
        margin-bottom: 2rem;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background-color: var(--color-primary);
        width: 0%;
        transition: width 0.3s ease;
      }
      .question-card {
        background: white;
        border-radius: var(--radius-lg);
        padding: 3rem;
        box-shadow: var(--shadow-card);
        text-align: center;
      }
      .question-text {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 2.5rem;
        color: var(--color-dark);
        line-height: 1.4;
      }
      .options-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .option-btn {
        background: #F9FAFB;
        border: 2px solid #E5E7EB;
        padding: 1.25rem 2rem;
        border-radius: 12px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
        font-family: inherit;
        color: var(--color-dark);
      }
      .option-btn:hover {
        border-color: var(--color-primary);
        background: #FDF2F8;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="nav-logo" aria-label="The LifeSkill Hub">
          <span class="brand-text">The LifeSkill <span class="brand-accent">Hub</span></span>
        </a>
      </div>
    </header>

    <main class="test-container">
      <div class="test-header">
        <h1 style="font-family: var(--font-display); color: var(--color-dark); margin-bottom: 0.5rem;">Trắc nghiệm tính cách MBTI</h1>
        <p style="color: var(--color-muted);" id="progressText">Câu hỏi 1 / 12</p>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="question-card" id="questionCard">
        <h2 class="question-text" id="questionText">Đang tải câu hỏi...</h2>
        <div class="options-container" id="optionsContainer">
          <!-- Các nút trả lời sẽ được render ở đây -->
        </div>
      </div>
    </main>

    <script>
      const questions = [
        // Trục E/I (5 câu)
        { text: "Trong một buổi tiệc, bạn thường làm gì?", a: "Nói chuyện với nhiều người, kể cả người lạ", b: "Chỉ trò chuyện với vài người bạn thân thiết", axis: "EI", aVal: "E", bVal: "I" },
        { text: "Bạn cảm thấy tràn đầy năng lượng hơn khi nào?", a: "Khi làm việc nhóm và giao tiếp", b: "Khi có thời gian ở một mình để suy ngẫm", axis: "EI", aVal: "E", bVal: "I" },
        { text: "Bạn thường ưu tiên kết bạn với những người như thế nào?", a: "Năng động, thích mở rộng mối quan hệ", b: "Sâu sắc, trân trọng các mối quan hệ lâu dài", axis: "EI", aVal: "E", bVal: "I" },
        { text: "Vào ngày nghỉ cuối tuần, bạn thích làm gì hơn?", a: "Ra ngoài tham gia các hoạt động xã hội hoặc gặp gỡ bạn bè", b: "Ở nhà đọc sách, xem phim hoặc thư giãn một mình", axis: "EI", aVal: "E", bVal: "I" },
        { text: "Trong môi trường làm việc, bạn thích:", a: "Không gian mở, nhộn nhịp và nhiều tương tác", b: "Không gian yên tĩnh, riêng tư và ít bị phân tâm", axis: "EI", aVal: "E", bVal: "I" },
        
        // Trục S/N (5 câu)
        { text: "Khi học một điều mới, bạn thích:", a: "Hiểu rõ các sự thật, chi tiết và tính thực tế", b: "Khám phá các ý tưởng, khái niệm và ý nghĩa ẩn sâu", axis: "SN", aVal: "S", bVal: "N" },
        { text: "Bạn thường miêu tả bản thân là người:", a: "Thực tế, nhìn nhận mọi việc như nó vốn có", b: "Mơ mộng, thường nghĩ về những khả năng tương lai", axis: "SN", aVal: "S", bVal: "N" },
        { text: "Bạn thích tác giả của một quyển sách:", a: "Viết rõ ràng, đi thẳng vào vấn đề", b: "Dùng nhiều phép ẩn dụ, gợi hình ảnh", axis: "SN", aVal: "S", bVal: "N" },
        { text: "Khi nghe một câu chuyện, bạn chú ý nhiều hơn đến:", a: "Các chi tiết cụ thể, sự kiện có thật đã xảy ra", b: "Bức tranh tổng thể và bài học rút ra từ đó", axis: "SN", aVal: "S", bVal: "N" },
        { text: "Bạn bị thu hút bởi những ý tưởng như thế nào?", a: "Có thể áp dụng ngay vào thực tế để giải quyết vấn đề", b: "Độc đáo, mới lạ và mang tính lý thuyết cao", axis: "SN", aVal: "S", bVal: "N" },

        // Trục T/F (5 câu)
        { text: "Khi đưa ra một quyết định quan trọng, bạn dựa vào:", a: "Tính logic, phân tích khách quan", b: "Cảm xúc cá nhân và ảnh hưởng đến người khác", axis: "TF", aVal: "T", bVal: "F" },
        { text: "Bạn đánh giá cao đặc điểm nào hơn ở người khác?", a: "Sự công bằng và lý trí", b: "Sự đồng cảm và nhân ái", axis: "TF", aVal: "T", bVal: "F" },
        { text: "Trong một cuộc tranh luận, điều gì quan trọng hơn với bạn?", a: "Tìm ra sự thật dù có mất lòng", b: "Duy trì sự hòa hợp, tránh xung đột", axis: "TF", aVal: "T", bVal: "F" },
        { text: "Khi một người bạn gặp khó khăn tìm đến bạn, bạn thường:", a: "Phân tích nguyên nhân và chỉ ra giải pháp giải quyết", b: "Lắng nghe, chia sẻ cảm xúc và an ủi họ trước tiên", axis: "TF", aVal: "T", bVal: "F" },
        { text: "Một người sếp lý tưởng đối với bạn là người:", a: "Công bằng, luôn đánh giá dựa trên hiệu quả công việc", b: "Tâm lý, luôn quan tâm đến cảm xúc của nhân viên", axis: "TF", aVal: "T", bVal: "F" },

        // Trục J/P (5 câu)
        { text: "Bạn thích làm việc theo cách nào?", a: "Lên kế hoạch rõ ràng và bám sát tiến độ", b: "Linh hoạt, tùy cơ ứng biến", axis: "JP", aVal: "J", bVal: "P" },
        { text: "Cảm giác của bạn trước một chuyến đi chơi xa:", a: "An tâm khi mọi thứ đã được lên lịch trình chi tiết", b: "Thích thú với sự tự do, thích đi đâu thì đi", axis: "JP", aVal: "J", bVal: "P" },
        { text: "Bàn làm việc của bạn thường:", a: "Gọn gàng, mọi thứ có vị trí riêng", b: "Hơi bừa bộn một chút, nhưng bạn vẫn biết đồ ở đâu", axis: "JP", aVal: "J", bVal: "P" },
        { text: "Bạn thường hoàn thành công việc như thế nào?", a: "Hoàn thành sớm trước hạn chót để yên tâm", b: "Thường đợi 'nước đến chân mới nhảy' để có áp lực", axis: "JP", aVal: "J", bVal: "P" },
        { text: "Khi đối mặt với một sự thay đổi bất ngờ:", a: "Bạn cảm thấy khó chịu vì mọi thứ đi chệch kế hoạch", b: "Bạn thấy thú vị và dễ dàng thích nghi với cái mới", axis: "JP", aVal: "J", bVal: "P" }
      ];

      let currentIndex = 0;
      const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

      const qText = document.getElementById('questionText');
      const optContainer = document.getElementById('optionsContainer');
      const progBar = document.getElementById('progressBar');
      const progText = document.getElementById('progressText');

      function renderQuestion() {
        if (currentIndex >= questions.length) {
          calculateResult();
          return;
        }

        const q = questions[currentIndex];
        qText.textContent = q.text;
        
        optContainer.innerHTML = '';
        
        const btnA = document.createElement('button');
        btnA.className = 'option-btn';
        btnA.textContent = q.a;
        btnA.onclick = () => selectOption(q.aVal);
        
        const btnB = document.createElement('button');
        btnB.className = 'option-btn';
        btnB.textContent = q.b;
        btnB.onclick = () => selectOption(q.bVal);

        optContainer.appendChild(btnA);
        optContainer.appendChild(btnB);

        // Update progress
        const percent = ((currentIndex) / questions.length) * 100;
        progBar.style.width = percent + '%';
        progText.textContent = `Câu hỏi ${currentIndex + 1} / ${questions.length}`;
      }

      function selectOption(value) {
        scores[value]++;
        currentIndex++;
        renderQuestion();
      }

      function calculateResult() {
        progBar.style.width = '100%';
        progText.textContent = 'Đang xử lý kết quả...';
        qText.textContent = 'Đang xử lý kết quả...';
        optContainer.innerHTML = '';

        const typeE = scores.E >= scores.I ? 'E' : 'I';
        const typeS = scores.S >= scores.N ? 'S' : 'N';
        const typeT = scores.T >= scores.F ? 'T' : 'F';
        const typeJ = scores.J >= scores.P ? 'J' : 'P';
        
        const finalType = typeE + typeS + typeT + typeJ;
        
        // Chuyển hướng sang trang kết quả
        window.location.href = `/test-result.html?test=mbti&res=${finalType}`;
      }

      // Khởi tạo
      renderQuestion();
    </script>
  </body>
</html>
